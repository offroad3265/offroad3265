<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Compléter le document | OFFROAD 32 65</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/web/pdf_viewer.css">
  <link rel="stylesheet" href="mobile-pdf.css?v=1">
</head>
<body>
  <header class="mobile-pdf-toolbar">
    <div class="mobile-pdf-brand">OFFROAD <span>32 65</span></div>
    <p>Appuyez sur les champs du document pour les compléter.</p>
    <div class="mobile-pdf-actions">
      <button id="savePdf" type="button" disabled>Enregistrer le PDF complété</button>
      <a id="returnToForm" href="documents.html">Revenir pour envoyer</a>
    </div>
    <div id="mobilePdfStatus" role="status" aria-live="polite">Chargement du document…</div>
  </header>

  <main id="viewerContainer" tabindex="0">
    <div id="viewer" class="pdfViewer"></div>
  </main>

  <script type="module" src="mobile-pdf.js?v=1"></script>
</body>
</html>
