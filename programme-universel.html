<script id="programme-adaptive-density-v2">
document.addEventListener("DOMContentLoaded",()=>{
  const id=new URLSearchParams(location.search).get("id");
  const p=(window.OFFROAD_PROGRAMMES||{})[id];
  const n=Number.isInteger(p?.nb_jours) ? p.nb_jours :
          (Array.isArray(p?.jours) ? p.jours.length :
          (Array.isArray(p?.etapes) ? p.etapes.length : 0));
  document.body.classList.remove("programme-short","programme-medium","programme-long");
  if(n>0 && n<=3) document.body.classList.add("programme-short");
  else if(n<=6) document.body.classList.add("programme-medium");
  else document.body.classList.add("programme-long");
});
</script>

<script>
document.addEventListener("DOMContentLoaded",()=>{
  const pays=(window.OFFROAD_PAYS||[]).slice().sort((a,b)=>(a.ordre||999)-(b.ordre||999));
  document.querySelectorAll(".nav-drop-menu").forEach(menu=>{
    menu.innerHTML=pays.map(p=>`<a href="${p.lien}">${p.nom}</a>`).join("")
      + '<a href="nos-raids.html">Tous nos raids</a>'
      + '<a href="raids-a-la-carte.html">Raids à la carte</a>';
  });

  const id=new URLSearchParams(location.search).get("id");
  const raid=window.OFFROAD_RAID_MODEL.raidFor(id);
  const p=window.OFFROAD_RAID_MODEL.programFor(id)||{};
  const title=document.getElementById("title");
  const subtitle=document.getElementById("subtitle");
  const meta=document.getElementById("meta");
  const days=document.getElementById("days");
  const side=document.getElementById("side");
  const back=document.getElementById("back");

  if(!raid){
    title.textContent="Programme introuvable";
    days.innerHTML='<div class="pending">Ce raid n’existe pas ou n’est plus disponible.</div>';
    side.innerHTML="";
    return;
  }

  title.textContent=p.titre||raid.titre||"Programme du raid";
  subtitle.textContent=p.sous_titre||raid.date||"";
  back.href=window.OFFROAD_RAID_MODEL.mediaUrl(raid);

  const signupLink=document.getElementById("signupLink");
  if(signupLink){
    const isOpen=window.OFFROAD_RAID_STATUS ? window.OFFROAD_RAID_STATUS.isOpen(raid) : /en cours d.?inscription|places disponibles/i.test(raid.statut||"");
    const isComplete=window.OFFROAD_RAID_STATUS ? window.OFFROAD_RAID_STATUS.isComplete(raid) : /complet/i.test(raid.statut||"");
    signupLink.style.display="inline-flex";
    if(isOpen){
      signupLink.href="inscription-raid.html?id="+encodeURIComponent(raid.id);
      signupLink.textContent="S’INSCRIRE À CE RAID";
    }else{
      signupLink.removeAttribute("href");
      signupLink.textContent=isComplete?"COMPLET":"INSCRIPTION À VENIR";
      signupLink.classList.add(isComplete?"is-complete":"is-upcoming");
      signupLink.style.pointerEvents="none";
      signupLink.setAttribute("aria-disabled","true");
    }
  }

  const sc=window.OFFROAD_RAID_MODEL.statusClass(raid.statut);
  meta.innerHTML=`
    <div><strong>DATES</strong>${raid.date||""}</div>
    <div><strong>SOLO</strong>${raid.prix_solo||"À venir"}</div>
    <div><strong>DUO</strong>${raid.prix_duo||"À venir"}</div>
    <div><strong>STATUT</strong><span class="${sc}">${raid.statut||""}</span></div>`;

  const central=window.OFFROAD_PROGRAMME_HELPERS?.get(raid.id);
      const nb=central?.nb_jours;
      const etapes=Array.isArray(central?.jours)?central.jours:[];
      if(Number.isInteger(nb) && nb>0){
        days.innerHTML=Array.from({length:nb},(_,i)=>{
          const e=etapes[i]||{};
          const title=e.titre||"À compléter";
          const text=e.texte||"Contenu de la journée à compléter.";
          return `<article class="card">
            <h3>Jour ${i+1}${title ? " • "+title : ""}</h3>
            <p>${text}</p>
          </article>`;
        }).join("");
      }else{
        days.innerHTML='<div class="pending">Programme détaillé à venir • nombre de jours à compléter.</div>';
      }

  const infos=p.infos||{};
  const blocks=[
    ["Inclus",infos.inclus],
    ["Non inclus",infos.non_inclus],
    ["Équipement obligatoire",infos.equipement]
  ];
  side.innerHTML='<h2 class="side-title">Tarifs & prestations</h2>'+
    blocks.map(([t,items])=>{
      if(!Array.isArray(items)||!items.length) return "";
      return `<article class="card"><h3>${t}</h3><ul>${items.map(x=>`<li>${x}</li>`).join("")}</ul></article>`;
    }).join("");
});
</script>




<script id="documents-global-dropdown-script">
document.addEventListener("DOMContentLoaded",()=>{
  document.querySelectorAll(".nav-documents-drop").forEach(drop=>{
    const trigger=drop.querySelector(".nav-documents-trigger");
    if(!trigger) return;
    trigger.addEventListener("click",(e)=>{
      if(e.target.closest(".nav-documents-arrow")){
        e.preventDefault();
        const open=drop.classList.toggle("is-open");
        trigger.setAttribute("aria-expanded",open?"true":"false");
      }
    });
  });
  document.addEventListener("click",(e)=>{
    document.querySelectorAll(".nav-documents-drop.is-open").forEach(drop=>{
      if(!drop.contains(e.target)){
        drop.classList.remove("is-open");
        const t=drop.querySelector(".nav-documents-trigger");
        if(t)t.setAttribute("aria-expanded","false");
      }
    });
  });
});
</script>

<script id="programme-fit-fixed-page">
(function(){
  function fitProgramme(){
    const body=document.body;
    body.classList.remove("programme-density-tight","programme-density-ultra");

    const main=document.querySelector(".detail-main,.programme-panel,.programme-clean,.detail-wrap");
    if(!main) return;

    const viewport=window.innerHeight;
    const bottom=main.getBoundingClientRect().bottom;

    if(bottom>viewport-8){
      body.classList.add("programme-density-tight");
    }

    requestAnimationFrame(()=>{
      const main2=document.querySelector(".detail-main,.programme-panel,.programme-clean,.detail-wrap");
      if(main2 && main2.getBoundingClientRect().bottom>window.innerHeight-8){
        body.classList.add("programme-density-ultra");
      }
    });
  }

  window.addEventListener("load",fitProgramme);
  window.addEventListener("resize",fitProgramme);
  document.addEventListener("DOMContentLoaded",()=>setTimeout(fitProgramme,0));
})();
</script>
