<style>
*{box-sizing:border-box}
:root{
  --black:#080808;
  --panel:#0f0f0f;
  --orange:#f57916;
  --green:#2d7c2a;
  --text:#f4f4f4;
  --muted:#c7c7c7;
}
html,body{margin:0;background:var(--black);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}

header{
  height:76px;
  background:#050505;
  border-bottom:1px solid #2a1a0e;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding:0 3%;
}
.brand{
  color:#fff;
  text-decoration:none;
  font-size:26px;
  font-weight:900;
  letter-spacing:.02em;
}
.brand span{color:var(--orange)}
nav{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
nav a{
  color:#f0f0f0;
  text-decoration:none;
  font-weight:900;
  font-size:13px;
  text-transform:uppercase;
}
nav a:hover{color:var(--orange)}
.reserve-top{
  background:var(--orange);
  color:#fff!important;
  padding:11px 17px;
  border-radius:5px;
}

.raid-screen{
  height:calc(100vh - 76px);
  min-height:620px;
  display:grid;
  grid-template-columns:46% 54%;
  grid-template-rows:1fr auto;
  background:#080808;
  overflow:hidden;
}

.raid-copy{
  grid-column:1;
  grid-row:1;
  padding:5vh 6% 3vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  background:
    radial-gradient(circle at 22% 30%,rgba(255,255,255,.025),transparent 38%),
    linear-gradient(180deg,#0c0c0c,#080808);
}
.kicker{
  color:var(--orange);
  text-transform:uppercase;
  font-size:15px;
  font-weight:900;
  letter-spacing:.12em;
}
.raid-copy h1{
  margin:10px 0 8px;
  font-family:Impact,Haettenschweiler,"Arial Narrow Bold","Arial Black",sans-serif;
  font-size:clamp(58px,7vw,108px);
  line-height:.9;
  letter-spacing:.02em;
  color:#fff;
  text-transform:uppercase;
}
.route{
  color:var(--orange);
  font-family:Impact,Haettenschweiler,"Arial Narrow Bold","Arial Black",sans-serif;
  font-size:clamp(22px,2.25vw,34px);
  letter-spacing:.025em;
  text-transform:uppercase;
  margin-bottom:28px;
}
.intro{
  max-width:620px;
  margin:0;
  font-size:18px;
  line-height:1.55;
  color:#f1f1f1;
}
.highlights{
  display:grid;
  gap:24px;
  margin-top:34px;
}
.highlight{
  display:grid;
  grid-template-columns:6px 62px 1fr;
  gap:18px;
  align-items:center;
}
.highlight-bar{
  width:4px;
  height:54px;
  background:var(--orange);
}
.highlight-icon{
  width:50px;
  height:50px;
  display:grid;
  place-items:center;
  border:1px solid #707070;
  border-radius:50%;
  color:#fff;
  font-size:23px;
}
.highlight strong{
  display:block;
  font-size:18px;
  text-transform:uppercase;
  color:#eee;
  margin-bottom:4px;
}
.highlight span{
  display:block;
  color:#bdbdbd;
  font-size:15px;
  line-height:1.35;
}

.visual-zone{
  grid-column:2;
  grid-row:1;
  min-height:0;
  display:grid;
  grid-template-columns:58% 42%;
  grid-template-rows:1fr 1fr;
  overflow:hidden;
  background:#111;
}
.visual-main{
  grid-column:1;
  grid-row:1/3;
  min-height:0;
  overflow:hidden;
}
.visual-small{
  min-height:0;
  overflow:hidden;
}
.visual-zone img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}
.visual-main img{object-position:center}
.visual-small.top img{object-position:center}
.visual-small.bottom img{object-position:center 40%}

.action-bar{
  grid-column:1/3;
  grid-row:2;
  display:grid;
  grid-template-columns:1fr 1fr .35fr;
  gap:14px;
  align-items:center;
  padding:14px 3%;
  background:#070707;
  border-top:1px solid #24180e;
}
.action{
  display:block;
  text-decoration:none;
  text-align:center;
  padding:17px 18px;
  border-radius:6px;
  font-size:20px;
  font-weight:900;
  text-transform:uppercase;
  color:#fff;
}
.discover{background:linear-gradient(180deg,#2f7d2b,#286c25)}
.signup{background:linear-gradient(180deg,#ff7f13,#ed6800)}
.whatsapp{
  color:#fff;
  text-decoration:none;
  text-align:center;
  font-weight:800;
  font-size:14px;
}
.whatsapp span{display:block;color:#42c85a;font-size:23px;margin-bottom:3px}

@media(max-width:1000px){
  header{height:auto;min-height:72px;padding:12px 4%;align-items:flex-start;flex-direction:column}
  nav{gap:12px}
  .raid-screen{
    height:auto;
    min-height:0;
    grid-template-columns:1fr;
    grid-template-rows:auto auto auto;
    overflow:visible;
  }
  .raid-copy{grid-column:1;grid-row:1;padding:34px 7%}
  .visual-zone{grid-column:1;grid-row:2;height:620px}
  .action-bar{grid-column:1;grid-row:3;grid-template-columns:1fr;padding:14px 5%}
  .raid-copy h1{font-size:64px}
}
@media(max-width:650px){
  .visual-zone{height:auto;display:block}
  .visual-zone > div{height:auto}
  .visual-zone img{height:auto}
  .highlight{grid-template-columns:5px 50px 1fr;gap:12px}
  .action{font-size:17px}
}

/* Bandeau actions : uniquement 2 boutons */
.action-bar{
  grid-template-columns:1fr 1fr!important;
}
.wa-top{
  color:#42c85a!important;
  border:1px solid #2f7f3f;
  padding:10px 13px;
  border-radius:5px;
  text-transform:none!important;
}
.wa-top:hover{
  color:#fff!important;
  background:#1f6f34;
}


/* ===== Police OFFROAD 32 65 : harmonisation des gros titres ===== */
h1,
h2,
h3,
.hero h1,
.hero h2,
.section-title,

}

</style>

<script>
document.addEventListener("DOMContentLoaded",()=>{
  const id=new URLSearchParams(location.search).get("id");
  const raid=(window.OFFROAD_RAIDS||[]).find(r=>r.id===id);
  const view=(window.OFFROAD_RAID_PRESENTATIONS||{})[id];
  if(id) document.body.classList.add("raid-"+id);

  if(!raid){
    document.getElementById("raidPresentationTitle").textContent="Raid introuvable";
    return;
  }

  const fallback={
    kicker:"Raid off-road",
    title:raid.titre||"Raid OFFROAD 32 65",
    route:raid.date||"",
    intro:"",
    photos:["","",""],
    highlights:[
      {title:"Aventure OFFROAD",text:"Découvrir le programme détaillé",icon:"△"},
      {title:"Convivialité",text:"Une expérience à partager.",icon:"◎"},
      {title:"Encadrement OFFROAD 32 65",text:"Organisation et accompagnement.",icon:"◉"}
    ]
  };
  const p=Object.assign({},fallback,view||{});
  // Règles universelles des fiches raid : terminologie et textes communs.
  p.kicker=String(p.kicker||"Raid off-road").replace(/\s*4x4\s*/ig,"").trim();
  if(/informations de présentation de ce raid seront complétées prochainement/i.test(p.intro||"")) p.intro="";
  p.highlights=(p.highlights||[]).map(h=>{
    const item=Object.assign({},h);
    if(/^aventure offroad$/i.test(String(item.title||"").trim())) item.text="Découvrir le programme détaillé";
    return item;
  });
  document.title=(raid.titre||"Raid")+" | OFFROAD 32 65";
  const meta=document.getElementById("raidMeta");
  if(meta){
    const country=(raid.pays||"").replace(/^./,c=>c.toUpperCase());
    const status=window.OFFROAD_RAID_STATUS ? window.OFFROAD_RAID_STATUS.label(raid) : (raid.statut||"");
    const statusClass=window.OFFROAD_RAID_STATUS?.isOpen(raid)?"available":window.OFFROAD_RAID_STATUS?.isComplete(raid)?"full":"upcoming";
    meta.innerHTML=[
      country?`<span class="meta-country">${country}</span>`:"",
      raid.date?`<span>${raid.date}</span>`:"",
      status?`<span class="meta-status ${statusClass}">${status}</span>`:""
    ].join("");
  }

  const specialNotice=document.getElementById("raidSpecialNotice");
  if(specialNotice) specialNotice.textContent=p.special_notice||"";

  document.getElementById("raidKicker").textContent=p.kicker;
  document.getElementById("raidPresentationTitle").textContent=p.title;
  document.getElementById("raidPresentationRoute").textContent=p.route;
  document.getElementById("raidPresentationIntro").textContent=p.intro;

  const photos=Array.isArray(p.photos)?p.photos:[];
  [1,2,3].forEach((n,i)=>{
    const img=document.getElementById("raidPhoto"+n);
    const src=photos[i]||photos[0]||"";
    if(src) img.src=src;
    else img.closest("div").style.display="none";
  });

  document.getElementById("raidHighlights").innerHTML=(p.highlights||[]).slice(0,3).map(h=>`
    <div class="highlight">
      <div class="highlight-bar"></div>
      <div class="highlight-icon">${h.icon||"•"}</div>
      <div><strong>${h.title||""}</strong><span>${h.text||""}</span></div>
    </div>`).join("");

  document.getElementById("detailRaidLink").href="detail-raid.html?id="+encodeURIComponent(id);
  const signup=document.getElementById("signupRaidLink");
  signup.href="inscription-raid.html?id="+encodeURIComponent(id);

  const isComplete=window.OFFROAD_RAID_STATUS ? window.OFFROAD_RAID_STATUS.isComplete(raid) : /complet/i.test(raid.statut||"");
  const isAvailable=window.OFFROAD_RAID_STATUS ? window.OFFROAD_RAID_STATUS.isOpen(raid) : /en cours d.?inscription|places disponibles/i.test(raid.statut||"");

  if(isComplete){
    signup.textContent="COMPLET";
    signup.classList.add("is-complete");
    signup.removeAttribute("href");
    signup.setAttribute("aria-disabled","true");
  }else if(!isAvailable){
    signup.textContent="INSCRIPTION À VENIR";
    signup.classList.add("is-upcoming");
    signup.removeAttribute("href");
    signup.setAttribute("aria-disabled","true");
  }
});
</script>

<script id="v273-documents-dropdown-script">
document.addEventListener("DOMContentLoaded",()=>{
  document.querySelectorAll(".nav-documents-drop").forEach(drop=>{
    const trigger=drop.querySelector(".nav-documents-trigger");
    if(!trigger) return;
    trigger.addEventListener("click",(e)=>{
      if(e.target.closest(".nav-documents-arrow")){
        e.preventDefault();
        const open=drop.classList.toggle("is-open");
        trigger.setAttribute("aria-expanded",open?"true":"false");
      }
    });
  });
  document.addEventListener("click",(e)=>{
    document.querySelectorAll(".nav-documents-drop.is-open").forEach(drop=>{
      if(!drop.contains(e.target)){
        drop.classList.remove("is-open");
        const trigger=drop.querySelector(".nav-documents-trigger");
        if(trigger) trigger.setAttribute("aria-expanded","false");
      }
    });
  });
});
</script>
