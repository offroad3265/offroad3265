<script id="programme-adaptive-density-v2">
document.addEventListener("DOMContentLoaded",()=>{
  const id=new URLSearchParams(location.search).get("id");
  const p=(window.OFFROAD_PROGRAMMES||{})[id];
  const n=Number.isInteger(p?.nb_jours) ? p.nb_jours :
          (Array.isArray(p?.jours) ? p.jours.length :
          (Array.isArray(p?.etapes) ? p.etapes.length : 0));
  document.body.classList.remove("programme-short","programme-medium","programme-long");
  if(n>0 && n<=3) document.body.classList.add("programme-short");
  else if(n<=6) document.body.classList.add("programme-medium");
  else document.body.classList.add("programme-long");
});
</script>

<script>
document.addEventListener("DOMContentLoaded",()=>{
  const pays=(window.OFFROAD_PAYS||[]).slice().sort((a,b)=>(a.ordre||999)-(b.ordre||999));
  document.querySelectorAll(".nav-drop-menu").forEach(menu=>{
    menu.innerHTML=pays.map(p=>`<a href="${p.lien}">${p.nom}</a>`).join("")
      + '<a href="nos-raids.html">Tous nos raids</a>'
      + '<a href="raids-a-la-carte.html">Raids à la carte</a>';
  });

  const id=new URLSearchParams(location.search).get("id");
  const raid=(window.OFFROAD_RAIDS||[]).find(r=>r.id===id);
  const programme=(window.OFFROAD_PROGRAMMES||{})[id]||{etapes:[]};

  const title=document.getElementById("programmeTitre");
  const sub=document.getElementById("programmeSousTitre");
  const meta=document.getElementById("raidMeta");
  const etapes=document.getElementById("programmeEtapes");
  const mediaBox=document.getElementById("raidMedia");
  const mediaImage=document.getElementById("raidMediaImage");
  const mediaVideo=document.getElementById("raidMediaVideo");
  const detailLink=document.getElementById("detailLink");
  const signupLink=document.getElementById("signupLink");

  if(!raid){
    title.textContent="Programme introuvable";
    sub.textContent="";
    if(film) film.style.display="none";
    meta.innerHTML="";
    etapes.innerHTML='<div class="pending">Ce raid n’existe pas ou n’est plus disponible.</div>';
    return;
  }

  title.textContent=programme.titre||raid.titre||"Programme du raid";
  sub.textContent=programme.sous_titre||raid.date||"";

  if(detailLink){
    if(detailLink){
    detailLink.href = window.OFFROAD_RAID_MODEL
      ? window.OFFROAD_RAID_MODEL.detailUrl(raid)
      : ("programme-universel.html?id="+encodeURIComponent(id));
    detailLink.style.display = "";
  }
  }

  const mediaType=(programme.media_type||"").toLowerCase();
  const mediaSrc=programme.media||programme.video||"";

  if(mediaSrc && mediaType==="image" && mediaImage){
    mediaImage.src=mediaSrc;
    mediaImage.alt=programme.titre||raid.titre||"Photo du raid";
    mediaImage.hidden=false;
    if(mediaVideo) mediaVideo.hidden=true;
  }else if(mediaSrc && mediaType==="video" && mediaVideo){
    mediaVideo.src=mediaSrc;
    mediaVideo.hidden=false;
    if(mediaImage) mediaImage.hidden=true;
  }else if(mediaBox){
    mediaBox.style.display="none";
  }

  if(signupLink){
    const isComplete=window.OFFROAD_RAID_STATUS ? window.OFFROAD_RAID_STATUS.isComplete(raid) : /complet/i.test(raid.statut||"");
    const isOpen=window.OFFROAD_RAID_STATUS ? window.OFFROAD_RAID_STATUS.isOpen(raid) : /en cours d.?inscription|places disponibles/i.test(raid.statut||"");
    signupLink.classList.remove("is-complete","is-upcoming");
    signupLink.style.display="";
    if(isComplete){
      signupLink.textContent="COMPLET";
      signupLink.classList.remove("green","status-disponible","available");
      signupLink.classList.add("is-complete");
      signupLink.style.background="#c61f1f";
      signupLink.style.backgroundColor="#c61f1f";
      signupLink.style.color="#fff";
      signupLink.removeAttribute("href");
      signupLink.setAttribute("aria-disabled","true");
    }else if(isOpen){
      signupLink.textContent="S’INSCRIRE À CE RAID";
      signupLink.href="inscription-raid.html?id="+encodeURIComponent(raid.id);
      signupLink.removeAttribute("aria-disabled");
    }else{
      signupLink.textContent="INSCRIPTION À VENIR";
      signupLink.classList.add("is-upcoming");
      signupLink.removeAttribute("href");
      signupLink.setAttribute("aria-disabled","true");
    }
  }

  const statusClass=window.OFFROAD_RAID_MODEL ? window.OFFROAD_RAID_MODEL.statusClass(raid.statut) : (/complet/i.test(raid.statut||"")?"status-complet":/en cours d.?inscription|places disponibles/i.test(raid.statut||"")?"status-disponible":"");
  meta.innerHTML=`
    <div><strong>DATES</strong>${raid.date||""}</div>
    <div><strong>SOLO</strong>${raid.prix_solo||"À venir"}</div>
    <div><strong>DUO</strong>${raid.prix_duo||"À venir"}</div>
    <div><strong>STATUT</strong><span class="${statusClass}">${window.OFFROAD_RAID_STATUS ? window.OFFROAD_RAID_STATUS.label(raid) : (raid.statut||"")}</span></div>`;

  if(!Array.isArray(programme.etapes)||!programme.etapes.length){
    etapes.innerHTML='<div class="pending">Programme détaillé à venir.</div>';
  }else{
    etapes.innerHTML=programme.etapes.map(e=>`
      <article class="etape">
        <div class="jour">${e.jour||""}</div>
        <h2>${e.titre||""}</h2>
        <p>${e.texte||""}</p>
        ${e.lien?`<a href="${e.lien}">Voir le détail</a>`:""}
      </article>`).join("");
  }
});</script>




<script id="documents-global-dropdown-script">
document.addEventListener("DOMContentLoaded",()=>{
  document.querySelectorAll(".nav-documents-drop").forEach(drop=>{
    const trigger=drop.querySelector(".nav-documents-trigger");
    if(!trigger) return;
    trigger.addEventListener("click",(e)=>{
      if(e.target.closest(".nav-documents-arrow")){
        e.preventDefault();
        const open=drop.classList.toggle("is-open");
        trigger.setAttribute("aria-expanded",open?"true":"false");
      }
    });
  });
  document.addEventListener("click",(e)=>{
    document.querySelectorAll(".nav-documents-drop.is-open").forEach(drop=>{
      if(!drop.contains(e.target)){
        drop.classList.remove("is-open");
        const t=drop.querySelector(".nav-documents-trigger");
        if(t)t.setAttribute("aria-expanded","false");
      }
    });
  });
});
</script>

<script id="modele-maroc-programmes">
document.addEventListener("DOMContentLoaded",()=>{
  const id=new URLSearchParams(location.search).get("id");
  const programme=window.OFFROAD_PROGRAMME_HELPERS?.get(id);
  if(!programme) return;
  const container=document.querySelector(".etapes");
  if(!container) return;
  const nb=programme.nb_jours;
  if(!Number.isInteger(nb)||nb<1){
    container.innerHTML='<div class="pending">Programme détaillé à venir • nombre de jours à compléter.</div>';
    return;
  }
  container.innerHTML=Array.from({length:nb},(_,i)=>{
    const d=(programme.jours||[])[i]||{};
    return `<article class="etape">
      <div class="jour">Jour ${i+1}</div>
      <h2>${d.titre||"À compléter"}</h2>
      <p>${d.texte||"Contenu de la journée à compléter."}</p>
    </article>`;
  }).join("");
});
</script>

<script id="programme-fit-fixed-page">
(function(){
  function fitProgramme(){
    const body=document.body;
    body.classList.remove("programme-density-tight","programme-density-ultra");

    const main=document.querySelector(".detail-main,.programme-panel,.programme-clean,.detail-wrap");
    if(!main) return;

    const viewport=window.innerHeight;
    const bottom=main.getBoundingClientRect().bottom;

    if(bottom>viewport-8){
      body.classList.add("programme-density-tight");
    }

    requestAnimationFrame(()=>{
      const main2=document.querySelector(".detail-main,.programme-panel,.programme-clean,.detail-wrap");
      if(main2 && main2.getBoundingClientRect().bottom>window.innerHeight-8){
        body.classList.add("programme-density-ultra");
      }
    });
  }

  window.addEventListener("load",fitProgramme);
  window.addEventListener("resize",fitProgramme);
  document.addEventListener("DOMContentLoaded",()=>setTimeout(fitProgramme,0));
})();
</script>
