<script>
document.addEventListener("DOMContentLoaded",()=>{
  const pays=(window.OFFROAD_PAYS||[]).slice().sort((a,b)=>(a.ordre||999)-(b.ordre||999));
  document.querySelectorAll(".nav-drop-menu").forEach(menu=>{
    menu.innerHTML=pays.map(p=>`<a href="${p.lien}">${p.nom}</a>`).join("")
      + '<a href="nos-raids.html">Tous nos raids</a>'
      + '<a href="raids-a-la-carte.html">Raids à la carte</a>';
  });

  const data=Array.isArray(window.OFFROAD_GALERIE)?window.OFFROAD_GALERIE:[];
  const paysSel=document.getElementById("filtrePays");
  const anneeSel=document.getElementById("filtreAnnee");
  const raidSel=document.getElementById("filtreRaid");
  const grid=document.getElementById("galleryGrid");

  [...new Set(data.map(x=>x.pays).filter(Boolean))].sort().forEach(v=>{
    const o=document.createElement("option");o.value=v;o.textContent=v.charAt(0).toUpperCase()+v.slice(1);paysSel.appendChild(o);
  });
  [...new Set(data.map(x=>x.annee).filter(Boolean))].sort((a,b)=>a-b).forEach(v=>{
    const o=document.createElement("option");o.value=v;o.textContent=v;anneeSel.appendChild(o);
  });
  [...new Set(data.map(x=>x.raid).filter(Boolean))].sort().forEach(v=>{
    const o=document.createElement("option");o.value=v;o.textContent=v;raidSel.appendChild(o);
  });

  function render(){
    const rows=data.filter(x=>
      (!paysSel.value||x.pays===paysSel.value) &&
      (!anneeSel.value||String(x.annee)===anneeSel.value) &&
      (!raidSel.value||x.raid===raidSel.value)
    );
    if(!rows.length){
      grid.innerHTML='<div class="empty">Aucun média dans cette sélection pour le moment.</div>';
      return;
    }
    grid.innerHTML=rows.map(x=>`
      <article class="gallery-item">
        ${x.type==="video"
          ? `<video controls preload="metadata"><source src="${x.media}" type="video/mp4"></video>`
          : `<img src="${x.media}" alt="${x.titre||"Photo OFFROAD 32 65"}">`}
        <div class="gallery-meta">
          <strong>${x.titre||x.raid||"OFFROAD 32 65"}</strong>
          <span>${[x.pays,x.annee,x.raid].filter(Boolean).join(" • ")}</span>
          ${x.legende?`<span>${x.legende}</span>`:""}
        </div>
      </article>`).join("");
  }
  [paysSel,anneeSel,raidSel].forEach(s=>s.addEventListener("change",render));
  render();
});
</script>




<script id="documents-global-dropdown-script">
document.addEventListener("DOMContentLoaded",()=>{
  document.querySelectorAll(".nav-documents-drop").forEach(drop=>{
    const trigger=drop.querySelector(".nav-documents-trigger");
    if(!trigger) return;
    trigger.addEventListener("click",(e)=>{
      if(e.target.closest(".nav-documents-arrow")){
        e.preventDefault();
        const open=drop.classList.toggle("is-open");
        trigger.setAttribute("aria-expanded",open?"true":"false");
      }
    });
  });
  document.addEventListener("click",(e)=>{
    document.querySelectorAll(".nav-documents-drop.is-open").forEach(drop=>{
      if(!drop.contains(e.target)){
        drop.classList.remove("is-open");
        const t=drop.querySelector(".nav-documents-trigger");
        if(t)t.setAttribute("aria-expanded","false");
      }
    });
  });
});
</script>

<script id="offroad-galerie-render-v88">
document.addEventListener("DOMContentLoaded",()=>{
  const flat=Array.isArray(window.OFFROAD_CONTENU?.galerie)?window.OFFROAD_CONTENU.galerie:[];
  const albums=window.OFFROAD_CONTENU?.galerieAlbums||{};
  const ordrePays=["Maroc","Espagne","Sardaigne","Tunisie"];
  const source=flat.length ? flat : ordrePays.flatMap(pays =>
    Array.isArray(albums[pays]) ? albums[pays].map(photo=>({...photo,pays})) : []
  );
  const photos=source.filter(x=>x && x.actif!==false)
    .slice().sort((a,b)=>(Number(a.ordre)||999)-(Number(b.ordre)||999));

  const grid=document.getElementById("gallery-grid");
  const empty=document.getElementById("gallery-empty");
  const countryBox=document.getElementById("gallery-country-filters");
  const nextBtn=document.getElementById("gallery-next-page");
  const lightbox=document.getElementById("gallery-lightbox");
  const lightImg=document.getElementById("gallery-lightbox-image");
  const lightCaption=document.getElementById("gallery-lightbox-caption");

  let country="Tous", visible=[], page=0, current=0;
  const unique=a=>[...new Set(a.filter(Boolean))];
  const perPage=()=>window.innerWidth<=760?4:10;

  const button=(label,active,onClick)=>{
    const b=document.createElement("button");
    b.type="button";
    b.className="gallery-filter"+(active?" is-active":"");
    b.textContent=label;
    b.addEventListener("click",onClick);
    return b;
  };

  function drawFilters(){
    const countries=["Tous","Maroc","Espagne","Sardaigne","Tunisie"];
    countryBox.replaceChildren(...countries.map(c=>button(c,c===country,()=>{
      country=c; page=0; render();
    })));
  }

  function caption(p){
    return [p.pays,p.annee,p.legende].filter(Boolean).join(" · ");
  }

  function render(){
    drawFilters();
    visible=photos.filter(p=>country==="Tous"||p.pays===country);
    const count=perPage();
    const pages=Math.max(1,Math.ceil(visible.length/count));
    if(page>=pages) page=0;
    const start=page*count;
    const shown=visible.slice(start,start+count);

    grid.innerHTML="";
    shown.forEach((p,i)=>{
      const item=document.createElement("button");
      item.type="button";
      item.className="gallery-item";
      item.setAttribute("aria-label","Agrandir "+(p.legende||p.pays||"la photo"));
      item.setAttribute("title","Cliquer pour agrandir");

      const img=document.createElement("img");
      img.src=p.fichier;
      img.alt=p.alt||p.legende||`Photo ${p.pays||"OFFROAD 32 65"}`;
      img.loading="lazy";
      item.appendChild(img);
      item.addEventListener("click",()=>open(start+i));
      grid.appendChild(item);
    });

    empty.hidden=visible.length!==0;
    nextBtn.hidden=pages<=1;
    nextBtn.textContent="SUIVANT ›";
  }

  nextBtn.addEventListener("click",()=>{
    const pages=Math.max(1,Math.ceil(visible.length/perPage()));
    if(pages<=1)return;
    grid.classList.add("is-sliding-left");
    window.setTimeout(()=>{
      page=(page+1)%pages;
      render();
      grid.classList.remove("is-sliding-left");
    },220);
  });

  function open(i){
    if(!visible.length)return;
    current=(i+visible.length)%visible.length;
    const p=visible[current];
    lightImg.src=p.fichier;
    lightImg.alt=p.alt||p.legende||"Photo du raid";
    lightCaption.textContent=caption(p);
    lightbox.hidden=false;
    document.body.style.overflow="hidden";
  }

  function close(){
    lightbox.hidden=true;
    document.body.style.overflow="";
  }

  lightbox.querySelector(".gallery-close").addEventListener("click",close);
  lightbox.querySelector(".gallery-prev").addEventListener("click",()=>open(current-1));
  lightbox.querySelector(".gallery-next").addEventListener("click",()=>open(current+1));
  lightbox.addEventListener("click",e=>{if(e.target===lightbox)close()});
  document.addEventListener("keydown",e=>{
    if(lightbox.hidden)return;
    if(e.key==="Escape")close();
    if(e.key==="ArrowLeft")open(current-1);
    if(e.key==="ArrowRight")open(current+1);
  });
  window.addEventListener("resize",()=>{page=0;render();});
  render();
});
</script>

  };

});
